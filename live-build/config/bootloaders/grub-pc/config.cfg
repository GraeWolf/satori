# Replaces live-build's default: a plain text menu on screen and serial port,
# with a timeout so unattended boots proceed. Used for both BIOS and UEFI.
set default=0
set timeout=5

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set menu_color_normal=light-gray/black
set menu_color_highlight=white/dark-gray
