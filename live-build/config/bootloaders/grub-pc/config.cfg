# Replaces live-build's default. Used for both BIOS and UEFI: Tekne's theme
# (tekne-branding, DEC-034) on screen, a plain text menu on the serial port
# for the automated tests, and a timeout so unattended boots proceed.
set default=0
set timeout=5

serial --unit=0 --speed=115200
terminal_input console serial

# Without the font there's no theme: fall back to a text menu on screen too.
if loadfont /boot/grub/unicode.pf2; then
	set gfxmode=auto
	insmod all_video
	insmod gfxterm
	insmod png
	terminal_output gfxterm serial
	set tekne_theme=/boot/grub/themes/tekne/theme.txt
	export tekne_theme
else
	terminal_output console serial
fi

source /boot/grub/theme.cfg
