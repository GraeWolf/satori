source /boot/grub/config.cfg

# Live boot. satori's own entries instead of the ones live-build generates,
# which are labelled "Live system" and include Debian's fail-safe options.
# (Don't name live-build's placeholder in a comment: it replaces any line that
# contains it with those entries.)
menuentry "satori live" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# For graphics that don't come up (e.g. some hybrid NVIDIA laptops): the
# kernel's generic framebuffer instead of the GPU driver.
menuentry "satori live (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

# Automated tests (tests/smoke/) press "s" at this menu: kernel output goes
# to the serial port too, and satori.serial starts a serial login prompt.
menuentry "satori live (serial console)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ console=tty0 console=ttyS0,115200n8 satori.serial
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
