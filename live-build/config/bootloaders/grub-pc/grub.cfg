source /boot/grub/config.cfg

# Live boot (entries generated by live-build)
@LINUX_LIVE@

# Automated tests (tests/smoke/) press "s" at this menu: kernel output goes
# to the serial port too, and satori.serial starts a serial login prompt.
menuentry "satori live (serial console)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ console=tty0 console=ttyS0,115200n8 satori.serial
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
