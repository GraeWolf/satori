# Replaces live-build's theme.cfg, which selects Debian's live theme. Sourced
# by config.cfg and again inside each submenu, because GRUB doesn't pass
# variables into submenus unless they're exported.
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-blue
if [ -n "${satori_theme}" ]; then
	set theme="${satori_theme}"
fi
