// Build only: live-build copies this to the chroot's /etc/apt/apt.conf while
// it builds the image (lb chroot_apt install) and removes it before the image
// is made (chroot_apt remove), so installed systems never see it.
//
// It keeps the build away from Tekne's own APT repository (DEC-040), which
// tekne-apt-sources configures: an ISO must contain the packages built from
// its own commit, never ones published earlier, and the build mustn't depend
// on GitHub Pages. live-build runs apt-get update after Tekne's hooks too, so
// a hook can't disable the source; instead the repository's host goes
// through a proxy that isn't there. apt-get update then warns "Failed to
// fetch .../tekne/apt/..." and carries on (a network failure is a warning,
// not an error). config/hooks/normal/0510-check-apt-origins.hook.chroot fails
// the build if anything was fetched from it anyway.
Acquire::https::Proxy::graewolf.github.io "http://127.0.0.1:9/";
Acquire::http::Proxy::graewolf.github.io "http://127.0.0.1:9/";
