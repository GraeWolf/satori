# Tekne's text console (tekne-branding, DEC-037): the Tokyo Night palette for
# the 16 console colours, so the LUKS prompt and console logins match the
# desktop, and loglevel=3 so firmware errors (ACPI BIOS table bugs and the
# like) stay in dmesg instead of cluttering the passphrase screen. Remove
# "quiet" from GRUB_CMDLINE_LINUX_DEFAULT to see everything again.
# Palette order: black (the background, #1a1b26), red, green, yellow, blue,
# magenta, cyan, white, then the bright versions.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} loglevel=3 vt.default_red=26,247,158,224,122,187,125,169,65,247,158,224,122,187,125,192 vt.default_grn=27,118,206,175,162,154,207,177,72,118,206,175,162,154,207,202 vt.default_blu=38,142,106,104,247,247,255,214,104,142,106,104,247,247,255,245"
