# satori's alacritty config: Tokyo Night (night). Used by satori-terminal when
# you have no alacritty config of your own. To customise, copy it to
# ~/.config/alacritty/alacritty.toml.

[window]
padding = { x = 6, y = 6 }

[font]
normal = { family = "JetBrains Mono" }
size = 10.5

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.selection]
background = "#283457"
text = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
