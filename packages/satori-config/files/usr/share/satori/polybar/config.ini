; satori's default polybar, started from the herbstluftwm autostart.
; Colours are placeholders until satori's branding (Phase 4).

[colors]
background = #1d2021
foreground = #ebdbb2
primary = #d79921
alert = #fb4934
disabled = #7c6f64

[bar/satori]
width = 100%
height = 22pt
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = JetBrains Mono:size=10;2
font-1 = Noto Color Emoji:scale=10;2
modules-left = xworkspaces xwindow
modules-right = pulseaudio wlan eth battery date tray
cursor-click = pointer
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty =

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "vol "
format-volume-prefix-foreground = ${colors.primary}
label-muted = muted
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol &

; Clicking a network module opens nmtui (DEC-011: no tray applet).
[network-base]
type = internal/network
interval = 5
format-connected = %{A1:alacritty -e nmtui &:}<label-connected>%{A}
format-disconnected = %{A1:alacritty -e nmtui &:}<label-disconnected>%{A}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = wifi %essid%
label-disconnected = wifi off
label-disconnected-foreground = ${colors.disabled}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = eth %local_ip%
label-disconnected =

[module/battery]
type = internal/battery
; Detected by the herbstluftwm autostart; polybar's defaults as a fallback.
battery = ${env:SATORI_BATTERY:BAT0}
adapter = ${env:SATORI_ADAPTER:ADP1}
full-at = 99
low-at = 10
label-charging = bat+ %percentage%%
label-discharging = bat %percentage%%
label-full = bat full
label-low = bat LOW %percentage%%
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 5
date = %a %d %b %H:%M

[module/tray]
type = internal/tray
tray-spacing = 4px

[settings]
screenchange-reload = true
