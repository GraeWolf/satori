# satori's notification style: Tokyo Night (satori-config, DEC-034). dunst
# reads this after its own /etc/xdg/dunst/dunstrc, and only when you have no
# ~/.config/dunst/dunstrc of your own.
[global]
    font = JetBrains Mono 10
    frame_width = 2
    corner_radius = 6
    separator_color = frame
    icon_theme = Papirus-Dark
    enable_recursive_icon_lookup = true

[urgency_low]
    background = "#1a1b26"
    foreground = "#a9b1d6"
    frame_color = "#414868"

[urgency_normal]
    background = "#1a1b26"
    foreground = "#c0caf5"
    frame_color = "#7aa2f7"

[urgency_critical]
    background = "#1a1b26"
    foreground = "#c0caf5"
    frame_color = "#f7768e"
