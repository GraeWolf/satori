# satori's GTK 3 defaults (satori-config, DEC-034): dark Adwaita and Papirus
# icons, to sit with the Tokyo Night desktop. ~/.config/gtk-3.0/settings.ini
# (which lxappearance writes) wins.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
