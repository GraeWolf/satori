#!/usr/sbin/nft -f
# satori's default firewall (DEC-023), loaded at boot by /etc/init.d/satori-firewall.
#
# Inbound: only loopback, replies to connections this machine made, the
# ICMPv6/DHCPv6 traffic IPv6 needs, and traffic from local container and VM
# bridges (podman, Docker, libvirt), which reaches this machine's DNS and DHCP.
# Forwarded: traffic from those bridges out, replies back in, and ports a
# container engine publishes deliberately (DNAT). Nothing else from outside
# reaches a bridge. Outbound: everything.
#
# To open a port, add a rule to the input chain, e.g.
#     tcp dport 22 accept
# then run: sudo service satori-firewall reload
# This is a conffile: package upgrades keep your changes.
#
# Only the "inet satori" table is replaced, so rules added by other software
# (libvirt, Docker, ...) in their own tables are left alone. Their accepts
# can't override a drop here, though: in nftables a drop in any table is
# final, which is why the bridges are accepted below.

table inet satori
delete table inet satori

table inet satori {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# IPv6 depends on these: neighbour discovery, router adverts, path MTU.
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# DHCPv6 replies from the local link.
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# Local container and VM bridges: DNS (aardvark-dns, dnsmasq) and DHCP.
		iifname "podman*" accept
		iifname "cni-podman*" accept
		iifname "docker0" accept
		iifname "br-*" accept
		iifname "virbr*" accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		# Containers and VMs reaching the network, and each other.
		iifname "podman*" accept
		iifname "cni-podman*" accept
		iifname "docker0" accept
		iifname "br-*" accept
		iifname "virbr*" accept

		# Ports a container engine publishes (podman/docker run -p).
		ct status dnat accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
