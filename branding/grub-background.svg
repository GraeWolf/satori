<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Tekne placeholder GRUB background: a small mark above the boot menu. CC-BY-SA-4.0 -->
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="120" y1="120" x2="392" y2="392">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1f2335"/>
      <stop offset="1" stop-color="#16161e"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- the 512-unit mark, 300 px across, centred at (960, 330) -->
  <g transform="translate(810 180) scale(0.5859375)">
    <circle cx="256" cy="256" r="206" fill="none" stroke="url(#ink)" stroke-width="14" opacity="0.55"/>
    <rect x="120" y="136" width="272" height="60" rx="30" fill="url(#ink)"/>
    <rect x="226" y="136" width="60" height="248" rx="30" fill="url(#ink)"/>
  </g>
</svg>
